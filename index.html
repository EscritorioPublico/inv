<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis invitaciones</title>
<style>
:root{--bg:#e0e5ec;--sl:#fff;--sd:#a3b1c6;--tp:#4a5568;--ts:#718096;--accent:#667eea;--danger:#f56565;--folder:#d69e2e;--line:#cbd5e1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tp);min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.neu-flat{background:var(--bg);box-shadow:8px 8px 16px var(--sd),-8px -8px 16px var(--sl);border-radius:16px}
.neu-pressed{background:var(--bg);box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);border-radius:10px;border:none}
.neu-btn{background:var(--bg);box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl);border-radius:10px;border:none;color:var(--tp);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit}
.neu-btn:hover{color:var(--accent)}
.neu-btn:active{box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.neu-btn.danger:hover{color:var(--danger)}
header{margin:20px 20px 0;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.2rem;display:flex;align-items:center;gap:12px}
.small{padding:8px 14px;font-size:.8rem;font-weight:600}
main{flex:1;display:flex;justify-content:center;padding:20px}
.panel{width:100%;max-width:800px;padding:24px;display:flex;flex-direction:column;gap:16px;align-self:flex-start}
.panel-header{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px}
.panel-title{font-size:.9rem;font-weight:700;color:var(--ts)}
.node-input{width:100%;font:inherit;font-size:.9rem;padding:10px 12px;color:var(--tp)}
#demo{font-size:.8rem;color:var(--ts);text-align:center}
.tree-children{position:relative;padding-left:28px;margin-top:4px}
.tree-children::before{content:'';position:absolute;left:10px;top:0;bottom:12px;width:2px;background:var(--line);border-radius:2px}
.tree-node{position:relative;margin-bottom:6px}
.tree-node::before{content:'';position:absolute;left:-18px;top:22px;width:18px;height:2px;background:var(--line)}
.tree-children>.tree-node:last-child::after{content:'';position:absolute;left:-18px;top:24px;bottom:-10px;width:2px;background:var(--bg)}
.tree-container>.tree-node::before,.tree-container>.tree-node::after{display:none}
.node-content{display:flex;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:10px;cursor:pointer;user-select:none;position:relative;z-index:2}
.node-content:hover,.node-content.sel{background:rgba(255,255,255,.4)}
.node-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-right:6px;color:var(--ts);font-size:10px;flex-shrink:0}
.node-icon{width:18px;height:18px;margin-right:10px;flex-shrink:0;color:var(--ts)}
.node-icon.f{color:var(--folder)}
.node-emoji{font-size:18px;line-height:18px;width:18px;margin-right:10px;flex-shrink:0}
.node-text-wrapper{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;overflow:hidden}
.node-name{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-link-icon{color:var(--ts);display:flex;flex-shrink:0}
.node-link-icon:hover{color:var(--accent)}
.node-actions{display:none;gap:6px;margin-left:10px}
.node-content:hover .node-actions,.node-content.sel .node-actions{display:flex}
.action-btn{width:30px;height:30px;border-radius:8px}
.action-btn svg{width:14px;height:14px}
.empty{text-align:center;padding:40px 16px;color:var(--ts);font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(74,85,104,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay[hidden]{display:none}
.dlg{width:100%;max-width:420px;padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:1.05rem}
.dlg label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--ts)}
.dlg label[hidden],.seg[hidden]{display:none}
.seg{display:flex;gap:10px}
.seg .neu-btn{flex:1;padding:8px;font-size:.8rem}
.seg .neu-btn.on{box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:132px;overflow-y:auto;padding:8px}
.emojis button{font-size:20px;line-height:1;padding:6px 0;border:none;background:none;border-radius:8px;cursor:pointer}
.emojis button:hover,.emojis button.on{background:rgba(102,126,234,.2)}
.emojis .none{grid-column:1/-1;font:inherit;font-size:.75rem;color:var(--ts);padding:4px}
.row{display:flex;gap:10px}
.row .neu-btn{padding:9px 16px;font-size:.85rem;font-weight:600}
#err{color:var(--danger);font-size:.8rem}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;font-size:.85rem;z-index:30}
#toast[hidden]{display:none}
@media(max-width:850px){main{padding:10px}.panel{padding:16px}header{margin:10px 10px 0}}
</style>
</head>
<body>
<header class="neu-flat">
  <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span id="title"></span></h1>
  <button class="neu-btn small" id="authBtn">Administrar</button>
</header>
<main>
  <div class="panel neu-flat">
    <div class="panel-header">
      <span class="panel-title">Contenido</span>
      <button class="neu-btn small" id="addRoot" hidden>+ Nueva carpeta</button>
    </div>
    <p id="demo" hidden>Modo demostración: nada se guarda. Conecta Supabase para guardar de verdad.</p>
    <input id="q" class="node-input neu-pressed" type="search" placeholder="Buscar..." aria-label="Buscar">
    <div class="tree-container" id="tree"></div>
  </div>
</main>

<div class="overlay" id="modal" hidden>
  <form class="dlg neu-flat" id="form">
    <h2 id="mTitle"></h2>
    <div class="seg" id="mType">
      <button type="button" class="neu-btn" data-f="0">Invitación</button>
      <button type="button" class="neu-btn" data-f="1">Carpeta</button>
    </div>
    <label>Nombre<input id="fName" class="node-input neu-pressed" maxlength="120" autocomplete="off"></label>
    <label>Emoji (opcional)<input id="fEmoji" class="node-input neu-pressed" maxlength="8" placeholder="👑" autocomplete="off"></label>
    <div class="emojis neu-pressed" id="emojiBox" aria-label="Elegir icono"></div>
    <label id="lUrl">Link<input id="fUrl" class="node-input neu-pressed" maxlength="500" placeholder="princesas/ o https://..." autocomplete="off"></label>
    <label>Ubicación<select id="fParent" class="node-input neu-pressed"></select></label>
    <div class="row"><button class="neu-btn" type="submit">Guardar</button><button class="neu-btn" type="button" data-close>Cancelar</button></div>
  </form>
</div>

<div class="overlay" id="loginModal" hidden>
  <form class="dlg neu-flat" id="loginForm">
    <h2>Entrar como administrador</h2>
    <label>Correo<input id="lEmail" type="email" class="node-input neu-pressed" autocomplete="username" required></label>
    <label>Contraseña<input id="lPass" type="password" class="node-input neu-pressed" autocomplete="current-password" required></label>
    <p id="err"></p>
    <div class="row"><button class="neu-btn" type="submit">Entrar</button><button class="neu-btn" type="button" data-close>Cancelar</button></div>
  </form>
</div>
<div id="toast" class="neu-flat" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pega aquí los datos de tu Supabase ======
const CONFIG = {
  url: "",   // Project URL, ej. https://abcd1234.supabase.co
  key: "",   // clave anon / publishable (NUNCA la service_role)
  titulo: "Mis invitaciones"
};
// ================================================================
const DEMO = !CONFIG.url || !CONFIG.key;
const $ = id => document.getElementById(id);
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const uid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const safe = u => { u = (u || '').trim(); return /^(javascript|data|vbscript):/i.test(u) ? '' : u; };
const FOLDER = '<svg class="node-icon f" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>';
const FILE = '<svg class="node-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>';
const ICON = {
  plus: '<path d="M12 5v14M5 12h14"/>', up: '<path d="M18 15l-6-6-6 6"/>', down: '<path d="M6 9l6 6 6-6"/>',
  edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>',
  del: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  link: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>'
};
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

let sb, items = [], isAdmin = DEMO, sel = null, query = '', F = {};
const closed = new Set();

const kids = p => items.filter(i => (i.parent_id || null) === (p || null)).sort((a, b) => a.position - b.position);
const byId = id => items.find(i => i.id === id);
const inside = (root, id) => root === id || kids(root).some(k => inside(k.id, id));

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }

async function db(op, payload, id) {
  if (DEMO) return;
  const t = sb.from('menu_items');
  const r = op === 'insert' ? await t.insert(payload) : op === 'update' ? await t.update(payload).eq('id', id) : await t.delete().eq('id', id);
  if (r.error) throw r.error;
}
async function reload() { if (DEMO) return; const r = await sb.from('menu_items').select('*'); if (!r.error) items = r.data; }
async function act(fn) {
  try { await fn(); } catch (e) { toast('No se pudo guardar: ' + (e.message || e)); await reload(); }
  render();
}

function nodeEl(n, q, anc) {
  const self = norm(n.name).includes(q);
  const kidEls = n.is_folder ? kids(n.id).map(k => nodeEl(k, q, anc || (q && self))).filter(Boolean) : [];
  if (q && !anc && !self && !kidEls.length) return null;
  const open = q ? true : !closed.has(n.id);
  const w = el('div', 'tree-node'), c = el('div', 'node-content' + (sel === n.id ? ' sel' : ''));
  const tg = el('span', 'node-toggle'); if (n.is_folder) tg.textContent = open ? '▼' : '▶';
  c.appendChild(tg);
  if (n.emoji) { const e = el('span', 'node-emoji'); e.textContent = n.emoji; c.appendChild(e); }
  else c.insertAdjacentHTML('beforeend', n.is_folder ? FOLDER : FILE);
  const tw = el('div', 'node-text-wrapper'), nm = el('span', 'node-name');
  nm.textContent = n.name; tw.appendChild(nm);
  const u = safe(n.url);
  if (isAdmin && u) {
    const a = el('a', 'node-link-icon', svg(ICON.link)); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.title = 'Abrir link';
    a.firstChild.setAttribute('width', 14); a.firstChild.setAttribute('height', 14); a.onclick = e => e.stopPropagation(); tw.appendChild(a);
  }
  c.appendChild(tw);
  if (isAdmin) {
    const ac = el('div', 'node-actions');
    const b = (title, ic, fn, cls) => { const x = el('button', 'neu-btn action-btn ' + (cls || ''), svg(ic)); x.title = title; x.setAttribute('aria-label', title); x.onclick = e => { e.stopPropagation(); fn(); }; ac.appendChild(x); };
    if (n.is_folder) b('Agregar aquí', ICON.plus, () => openForm({ parent: n.id }));
    b('Mover arriba', ICON.up, () => move(n.id, -1));
    b('Mover abajo', ICON.down, () => move(n.id, 1));
    b('Editar', ICON.edit, () => openForm({ id: n.id }));
    b('Eliminar', ICON.del, () => del(n), 'danger');
    c.appendChild(ac);
  }
  c.onclick = () => {
    if (isAdmin) { sel = n.id; if (n.is_folder) toggle(n.id); else render(); return; }
    if (n.is_folder) toggle(n.id); else if (u) location.href = u;
  };
  w.appendChild(c);
  if (n.is_folder && open && kidEls.length) { const ch = el('div', 'tree-children'); kidEls.forEach(k => ch.appendChild(k)); w.appendChild(ch); }
  return w;
}
function toggle(id) { closed.has(id) ? closed.delete(id) : closed.add(id); render(); }

function render() {
  $('addRoot').hidden = !isAdmin;
  $('authBtn').hidden = DEMO;
  $('authBtn').textContent = isAdmin ? 'Salir' : 'Administrar';
  const c = $('tree'); c.innerHTML = '';
  const q = norm(query.trim());
  const els = kids(null).map(r => nodeEl(r, q, false)).filter(Boolean);
  if (!els.length) {
    c.appendChild(el('div', 'empty', ''));
    c.firstChild.textContent = !items.length ? (isAdmin ? 'Todavía no hay nada. Toca "+ Nueva carpeta" para empezar.' : 'Todavía no hay contenido.') : 'No encontré nada con esa búsqueda.';
    return;
  }
  els.forEach(e => c.appendChild(e));
}

async function move(id, dir) {
  const n = byId(id), sib = kids(n.parent_id), i = sib.findIndex(s => s.id === id), j = i + dir;
  if (j < 0 || j >= sib.length) return;
  [sib[i], sib[j]] = [sib[j], sib[i]];
  const ch = []; sib.forEach((s, k) => { if (s.position !== k) { s.position = k; ch.push(s); } });
  act(() => Promise.all(ch.map(s => db('update', { position: s.position }, s.id))));
}
function del(n) {
  if (!confirm(n.is_folder ? `¿Eliminar "${n.name}" y todo lo que contiene?` : `¿Eliminar "${n.name}"?`)) return;
  act(async () => {
    await db('delete', null, n.id);
    const gone = new Set(); (function g(i) { gone.add(i); kids(i).forEach(k => g(k.id)); })(n.id);
    items = items.filter(i => !gone.has(i.id));
  });
}

// ---- Formulario agregar / editar ----
function setType(f) { F.folder = f; [...$('mType').children].forEach(b => b.classList.toggle('on', (b.dataset.f === '1') === f)); $('lUrl').hidden = f; }
function openForm(o) {
  const n = o.id ? byId(o.id) : null;
  F = { id: o.id || null, folder: n ? n.is_folder : !!o.folder };
  $('mTitle').textContent = n ? 'Editar' : 'Agregar';
  $('mType').hidden = !!n; setType(F.folder);
  $('fName').value = n ? n.name : ''; $('fEmoji').value = (n && n.emoji) || ''; $('fUrl').value = (n && n.url) || '';
  const s = $('fParent'); s.innerHTML = ''; s.add(new Option('Principal (sin carpeta)', ''));
  (function walk(p, d) { kids(p).filter(k => k.is_folder && !(n && inside(n.id, k.id))).forEach(k => { s.add(new Option('\u00A0\u00A0'.repeat(d) + (k.emoji || '📁') + ' ' + k.name, k.id)); walk(k.id, d + 1); }); })(null, 0);
  s.value = n ? (n.parent_id || '') : (o.parent || '');
  $('modal').hidden = false; $('fName').focus();
}
const EMOJIS = '🎉 🎂 🎈 🎁 🥳 🧸 👑 🦄 🌈 ⭐ 🌟 ✨ 🎀 🍭 🍬 🍰 🧁 🍕 🍔 🍿 🎪 🎠 🎡 🎨 🎭 🎵 🎮 🚀 🛸 🦖 🐶 🐱 🐻 🐼 🦁 🐯 🐸 🐵 🦋 🌺 🌸 🌻 🌴 🏖️ 🏰 🧚 🦸 🤖 👾 ⚽ 🏀 🎯 🏆 🏫 🎓 👶 💌 💍 📁 📂 🍄 🏴‍☠️ 🧜‍♀️ 🐠'.split(' ');
(function () {
  const b = $('emojiBox');
  const none = el('button', 'none'); none.type = 'button'; none.textContent = 'Sin icono (usar el de carpeta/archivo)'; none.onclick = () => { $('fEmoji').value = ''; };
  b.appendChild(none);
  EMOJIS.forEach(e => { const x = el('button'); x.type = 'button'; x.textContent = e; x.onclick = () => { $('fEmoji').value = e; }; b.appendChild(x); });
})();
$('mType').onclick = e => { if (e.target.dataset.f !== undefined) setType(e.target.dataset.f === '1'); };
$('form').onsubmit = e => {
  e.preventDefault();
  const name = $('fName').value.trim(); if (!name) { toast('Escribe un nombre'); return; }
  const row = { name, emoji: $('fEmoji').value.trim() || null, url: F.folder ? null : (safe($('fUrl').value) || null), parent_id: $('fParent').value || null };
  $('modal').hidden = true;
  act(async () => {
    if (F.id) {
      const n = byId(F.id);
      if ((n.parent_id || null) !== row.parent_id) row.position = kids(row.parent_id).length;
      await db('update', row, F.id); Object.assign(n, row);
    } else {
      Object.assign(row, { id: uid(), is_folder: F.folder, position: kids(row.parent_id).length });
      await db('insert', row); items.push(row);
    }
  });
};
$('addRoot').onclick = () => openForm({ folder: true });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { $('modal').hidden = true; $('loginModal').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('modal').hidden = true; $('loginModal').hidden = true; } });
$('q').oninput = e => { query = e.target.value; render(); };

// ---- Sesión de administrador ----
$('authBtn').onclick = async () => {
  if (isAdmin) { await sb.auth.signOut(); return; }
  $('err').textContent = ''; $('loginModal').hidden = false; $('lEmail').focus();
};
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const r = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  if (r.error) { $('err').textContent = 'Correo o contraseña incorrectos.'; return; }
  $('loginModal').hidden = true; $('lPass').value = '';
};

async function init() {
  $('title').textContent = CONFIG.titulo; document.title = CONFIG.titulo;
  if (DEMO) {
    $('demo').hidden = false;
    items = [
      { id: 'a', parent_id: null, name: 'Invitaciones', emoji: '🎉', url: null, is_folder: true, position: 0 },
      { id: 'b', parent_id: 'a', name: 'Infantiles', emoji: null, url: null, is_folder: true, position: 0 },
      { id: 'c', parent_id: 'b', name: 'Mario Bros', emoji: '🍄', url: 'mario-bros/', is_folder: false, position: 0 },
      { id: 'd', parent_id: 'b', name: 'Lilo & Stitch', emoji: '🌺', url: 'lilo-stitch/', is_folder: false, position: 1 }
    ];
  } else {
    if (!window.supabase) { $('tree').textContent = 'No se pudo cargar Supabase. Revisa tu conexión.'; return; }
    sb = supabase.createClient(CONFIG.url, CONFIG.key);
    sb.auth.onAuthStateChange((_e, s) => { isAdmin = !!s; sel = null; render(); });
    const s = await sb.auth.getSession(); isAdmin = !!s.data.session;
    const r = await sb.from('menu_items').select('*');
    if (r.error) { $('tree').textContent = 'No se pudo cargar el menú: ' + r.error.message; return; }
    items = r.data;
  }
  render();
}
init();
</script>
</body>
</html>
