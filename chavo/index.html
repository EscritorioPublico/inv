    <script id="ep-404">
      window.EP_404 = {
        /* Valores por defecto. El CRM (Config › Supab › Personalizados › Invitaciones › «Error 404») los reemplaza:

        slug: "",

        load: function (url, key, slug) {

          var b = st === "b";

                '<g class="face__eyes" transform="translate(0, 112.5)">' +
                  '<g transform="translate(15, 0)"><polyline class="face__eye-lid" points="37,0 0,120 75,120" /><polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35" /></g>' +
                  '<g transform="translate(230, 0)"><polyline class="face__eye-lid" points="37,0 0,120 75,120" /><polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35" /></g>' +
                '</g>' +
                '<rect class="face__nose" rx="4" ry="4" x="132.5" y="112.5" width="55" height="155" />' +
                '<g stroke-dasharray="102 102" transform="translate(65, 334)">' +
                  '<path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0" stroke-dashoffset="-102" />' +
                  '<path class="face__mouth-right" d="M 95 0 C 150 0 190 30 190 30" stroke-dashoffset="102" />' +
                '</g>' +
              '</g>' +
            '</svg>';
        },

          return '<div class="ep404b"><section class="ep4b-wrapper"><div class="ep4b-container">' +

              '<div class="two" data-depth="0.60"><div class="content">' + piezas + '</div></div>' +

        /* Movimiento del fondo (sin librerías): las capas se mueven según su data-depth.

            '<h1>' + this.esc(this.title) + '</h1><p>' + this.esc(this.text) + '</p>' + this.action("a") + '</div>';
