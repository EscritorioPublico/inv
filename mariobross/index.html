.ohana-env{position:relative;display:block;width:min(300px,86%);aspect-ratio:16/9;margin:0 auto 32px;padding:0;border:0;border-radius:6px;background:linear-gradient(135deg,#c8102e,#e52521 55%,#0e6fd1);cursor:pointer;perspective:800px;-webkit-tap-highlight-color:transparent;animation:ohanaGlow 2.6s ease-in-out infinite}

@keyframes ohanaLetter{0%{opacity:0;transform:translateY(var(--lift))}12%{opacity:1}100%{opacity:1;transform:translateY(0)}}

/* ===== Tipografía del nombre (estilo logo), cuenta regresiva con bloques y Yoshi ===== */
.mq-name{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;font-family:'MarioName','Titan One',Impact,sans-serif;font-size:var(--mq-name-size,48px);line-height:1.05;letter-spacing:.012em;-webkit-text-stroke:.16em #111;paint-order:stroke fill;text-shadow:.06em .08em 0 #8fa0c9;max-width:100%}
.mq-l{display:inline-block;transform-origin:50% 85%}
.mq-l:nth-child(5n+1){color:#2f9be6}.mq-l:nth-child(5n+2){color:#43b047}.mq-l:nth-child(5n+3){color:#fbd000}.mq-l:nth-child(5n+4){color:#e52521}.mq-l:nth-child(5n+5){color:#43b047}
.mq-l:nth-child(odd){transform:rotate(-3deg) translateY(.015em)}.mq-l:nth-child(even){transform:rotate(2.5deg) translateY(-.02em)}
.mq-s{display:inline-block;width:.3em}
.mq-cd{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 12px;position:relative;z-index:10}
.mq-cdl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#c8102e}
.mq-cdr{display:flex;gap:10px;justify-content:center}
.mq-cdc{display:flex;flex-direction:column;align-items:center;gap:7px}
.mq-ul{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5a4636}
.qblock.num>span:nth-child(4){display:none}
.qblock.num>span:nth-child(2)::before{animation-duration:1.6s}
.qblock .qn{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-family:'MarioName','Titan One',Impact,sans-serif;font-size:28px;line-height:1;color:#fff;-webkit-text-stroke:.14em #6b2a00;paint-order:stroke fill;text-shadow:.05em .07em 0 rgba(0,0,0,.25);pointer-events:none}
.qblock .qn.tick{animation:qtick .38s ease-out}
@keyframes qtick{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.mq-photo-row{display:flex;align-items:flex-end;justify-content:center;margin:2px 0 6px}
.mq-yoshi{position:relative;z-index:25;flex:0 0 auto;width:112px;height:auto;margin-right:-22px;margin-bottom:-4px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));transform-origin:50% 100%;animation:mqYo 1.5s ease-in-out infinite}
@keyframes mqYo{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-9px) rotate(-3deg)}60%{transform:translateY(-9px) rotate(3deg)}80%{transform:translateY(0) rotate(0)}}
@media (prefers-reduced-motion:reduce){.mq-yoshi,.qblock .qn.tick{animation:none}}
.mq-cd.sm{margin:0;gap:4px}.mq-cd.sm .mq-cdr{gap:6px}.mq-cd.sm .mq-cdc{gap:3px}.mq-cd.sm .qblock{zoom:.78}.mq-cd.sm .mq-ul{font-size:10px}.mq-cdd{font-size:12px;font-weight:800;color:#c8102e;margin-top:1px;line-height:1.2;text-align:center}

              img.onload = function () {
                var sc = Math.min(1, me.MAX_PX / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
                var cv = document.createElement("canvas"), cx = cv.getContext("2d"), q = 0.82, out;
                function draw() { cv.width = w; cv.height = h; cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h); out = cv.toDataURL("image/jpeg", q); }
                draw();
                while (out.length > me.MAX_CHARS && q > 0.45) { q -= 0.08; out = cv.toDataURL("image/jpeg", q); }
                while (out.length > me.MAX_CHARS && w > 360) { w = Math.round(w * 0.85); h = Math.round(h * 0.85); q = 0.7; draw(); }
                if (out.length > me.MAX_CHARS * 1.6) { alert("La imagen es muy pesada incluso reducida. Prueba con otra."); return; }
                cb(out);
              };
              img.src = rd.result;
            };
            rd.readAsDataURL(file);
          };
          f.click();
        },
        /* Fila «URL + Subir + Quitar» (se pinta con el jsx del panel: C) */
        row: function (C, val, set, ph) {
          var me = this, isData = /^data:image\//.test(val || "");
          var inp = C.jsx("input", {
            type: isData ? "text" : "url", readOnly: isData, placeholder: ph,
            value: isData ? "📷 Imagen subida desde tu equipo (" + Math.round(val.length * 0.75 / 1024) + " KB)" : val,
            onChange: function (e) { set(e.target.value.trim()); },
            className: "flex-1 min-w-0 w-full h-11 px-3 rounded-xl bg-[#fffaf0] border border-[#f0c36b] text-[#2b1d12] text-[13px] font-medium outline-none focus:border-[#c8102e]"
          });
          var up = C.jsxs("button", {
            type: "button", onClick: function () { me.pick(set); }, title: "Subir imagen desde tu equipo",
            className: "shrink-0 h-11 px-3 rounded-xl bg-[#fff4d6] hover:bg-[#ffe9a8] text-[#c8102e] text-[12px] font-bold border border-[#ffd34d]/60 flex items-center gap-1 cursor-pointer",
            children: [C.jsx("span", { className: "material-symbols-outlined text-[17px]", children: "upload" }), C.jsx("span", { children: "Subir" })]
          });
          var clr = val ? C.jsx("button", {
            type: "button", onClick: function () { set(""); }, title: "Quitar (vuelve a la imagen original)",
            className: "shrink-0 h-11 w-11 rounded-xl bg-white hover:bg-red-50 text-red-600 border border-red-200 flex items-center justify-center cursor-pointer",
            children: C.jsx("span", { className: "material-symbols-outlined text-[17px]", children: "close" })
          }) : null;
          return C.jsxs("div", { className: "flex items-center gap-2", children: [inp, up, clr] });
        }
      };
    </script>
  </head>
  <body class="bg-[#fffaf0] text-[#2b1d12] antialiased select-none selection:bg-[#ffd34d]">
    <div id="root"></div>
  </body>
</html>
