              img.onload = function () {
                var sc = Math.min(1, me.MAX_PX / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
                var cv = document.createElement("canvas"), cx = cv.getContext("2d"), q = 0.82, out;
                function draw() { cv.width = w; cv.height = h; cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h); out = cv.toDataURL("image/jpeg", q); }
                draw();
                while (out.length > me.MAX_CHARS && q > 0.45) { q -= 0.08; out = cv.toDataURL("image/jpeg", q); }
                while (out.length > me.MAX_CHARS && w > 360) { w = Math.round(w * 0.85); h = Math.round(h * 0.85); q = 0.7; draw(); }
                if (out.length > me.MAX_CHARS * 1.6) { alert("La imagen es muy pesada incluso reducida. Prueba con otra."); return; }
                cb(out);
              };
              img.src = rd.result;
            };
            rd.readAsDataURL(file);
          };
          f.click();
        },
        /* Fila «URL + Subir + Quitar» (se pinta con el jsx del panel: C) */
        row: function (C, val, set, ph) {
          var me = this, isData = /^data:image\//.test(val || "");
          var inp = C.jsx("input", {
            type: isData ? "text" : "url", readOnly: isData, placeholder: ph,
            value: isData ? "📷 Imagen subida desde tu equipo (" + Math.round(val.length * 0.75 / 1024) + " KB)" : val,
            onChange: function (e) { set(e.target.value.trim()); },
            className: "flex-1 min-w-0 w-full h-11 px-3 rounded-xl bg-[#f3f9ff] border border-[#9cc4ea] text-[#12304f] text-[13px] font-medium outline-none focus:border-[#0b5fb3]"
          });
          var up = C.jsxs("button", {
            type: "button", onClick: function () { me.pick(set); }, title: "Subir imagen desde tu equipo",
            className: "shrink-0 h-11 px-3 rounded-xl bg-[#eef7ff] hover:bg-[#e3f1ff] text-[#0b5fb3] text-[12px] font-bold border border-[#a6d4ff]/60 flex items-center gap-1 cursor-pointer",
            children: [C.jsx("span", { className: "material-symbols-outlined text-[17px]", children: "upload" }), C.jsx("span", { children: "Subir" })]
          });
          var clr = val ? C.jsx("button", {
            type: "button", onClick: function () { set(""); }, title: "Quitar (vuelve a la imagen original)",
            className: "shrink-0 h-11 w-11 rounded-xl bg-white hover:bg-red-50 text-red-600 border border-red-200 flex items-center justify-center cursor-pointer",
            children: C.jsx("span", { className: "material-symbols-outlined text-[17px]", children: "close" })
          }) : null;
          return C.jsxs("div", { className: "flex items-center gap-2", children: [inp, up, clr] });
        }
      };
    </script>
