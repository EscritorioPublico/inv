    <script id="ep-404">
      window.EP_404 = {
        /* Valores por defecto. El CRM (Config › Supab › Personalizados › Invitaciones › «Error 404») los reemplaza:

                  '<g transform="translate(230, 0)"><polyline class="face__eye-lid" points="37,0 0,120 75,120" /><polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35" /></g>' +

                  '<path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0" stroke-dashoffset="-102" />' +

              '</g>' +

          return '<div class="ep404b"><section class="ep4b-wrapper"><div class="ep4b-container">' +

</style><script id="sonic-logo-js">
window.__snLogo=function(C,name,year,id,maxW,cls){
 var nm=String(name||'SONIC').toUpperCase().trim()||'SONIC',n=nm.length,fs=64,ls=5,W=Math.round(n*(0.63*fs+ls)+44),H=104,gid='sng'+id;
 var common={x:W/2+ls/2,y:76,textAnchor:'middle',letterSpacing:ls,fontFamily:"'Titan One',Impact,sans-serif",fontSize:fs,strokeLinejoin:'round',strokeLinecap:'round'};
 function T(o){return C.jsx('text',Object.assign({},common,o,{children:nm}))}
 function stop(o,c){return C.jsx('stop',{offset:o,stopColor:c})}
 var svg=C.jsxs('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':nm,style:{display:'block',width:'100%',overflow:'visible'},children:[
  C.jsx('defs',{children:C.jsxs('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1,children:[stop(0,'#f6a31b'),stop(.55,'#fbcf14'),stop(1,'#fff00f')]})}),
  T({fill:'#173f52',stroke:'#173f52',strokeWidth:30}),
  T({fill:'#2a3484',stroke:'#2a3484',strokeWidth:22}),
  T({fill:'url(#'+gid+')',stroke:'#dd9522',strokeWidth:5,paintOrder:'stroke'})
 ]});
 var mw=Math.min(maxW||300,Math.round(W*0.9));
 return C.jsxs('div',{className:'sn-logo '+(cls||''),style:{maxWidth:mw},children:[svg,C.jsx('div',{className:'sn-strip',children:(function(a){a=parseInt(a,10);return a>0?'CUMPLE '+a+(a===1?' AÑITO':' AÑITOS'):''})(year)})]});
};
