/* ===== Nombre estilo logo Spider-Man ===== */
.sp-nameblock{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:8px;text-align:center}
.sp-name{position:relative;display:inline-block;max-width:100%;font-family:'SpFont','Impact','Arial Black',sans-serif;font-weight:400;line-height:1;letter-spacing:.03em;text-transform:uppercase;transform:skewX(-8deg);padding:.06em .1em;text-wrap:balance}
.sp-name::before{content:attr(data-text);position:absolute;inset:0;padding:inherit;z-index:0;color:#c8101a;-webkit-text-stroke:.17em #c8101a;text-shadow:.05em .06em 0 #7a0010,.09em .12em 0 #4a0009,.12em .17em 0 #2a0005,0 .22em .3em rgba(0,0,0,.35);pointer-events:none}
.sp-name__fill{position:relative;z-index:1;display:block;background:linear-gradient(180deg,#fff 0%,#f3f7ff 45%,#a9c6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sp-nameblock--lg .sp-name{font-size:clamp(34px,12.5vw,52px)}
.sp-nameblock--sm .sp-name{font-size:clamp(26px,8.6vw,34px)}
.sp-nameblock__sub{font-weight:800;color:#c4141f;text-transform:uppercase;letter-spacing:.12em}
.sp-nameblock--lg .sp-nameblock__sub{font-size:14px}
.sp-nameblock--sm .sp-nameblock__sub{font-size:10.5px;letter-spacing:.14em}
/* ===== Cuenta regresiva premium ===== */
.sp-cd{position:relative;isolation:isolate;overflow:hidden;width:100%;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;color:#fff;background:radial-gradient(120% 90% at 8% 0%,rgba(204,27,34,.34),transparent 55%),radial-gradient(110% 90% at 100% 100%,rgba(89,198,255,.26),transparent 55%),linear-gradient(155deg,#0c1a4d 0%,#10246e 52%,#1b0a2e 100%);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(12,26,77,.45),0 0 0 1px rgba(204,27,34,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.sp-cd::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.2;pointer-events:none;background-image:repeating-conic-gradient(from 0deg at 50% 125%,rgba(255,255,255,.7) 0 .7deg,transparent .7deg 14deg),repeating-radial-gradient(circle at 50% 125%,transparent 0 26px,rgba(255,255,255,.55) 26px 27px)}
.sp-cd::after{content:'';position:absolute;top:-10%;bottom:-10%;width:38%;left:-60%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:spShine 6.5s ease-in-out 1.2s infinite}
@keyframes spShine{0%{left:-60%}38%,100%{left:140%}}
.sp-cd__top{display:flex;align-items:center;justify-content:space-between}
.sp-cd__badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(90deg,#b3001b,#e0262d);box-shadow:0 2px 10px rgba(204,27,34,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.sp-cd__bolt{font-size:18px;animation:spBolt 1.8s infinite}
@keyframes spBolt{0%,100%{opacity:1;filter:drop-shadow(0 0 6px #59c6ff)}46%{opacity:.35}50%{opacity:1}54%{opacity:.5}}
.sp-cd__title{font-size:15px;font-weight:800;letter-spacing:.01em;text-shadow:0 1px 10px rgba(89,198,255,.5)}
.sp-cd__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sp-cd__tile{position:relative;overflow:hidden;text-align:center;padding:10px 4px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 14px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sp-cd__tile::before{content:'';position:absolute;left:0;right:0;top:44%;height:1px;background:rgba(0,0,0,.3);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.sp-cd__num{position:relative;display:block;font-family:'SpFont','Impact',sans-serif;font-size:36px;line-height:1.05;letter-spacing:.04em;background:linear-gradient(180deg,#fff 10%,#aecbff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(150,0,20,.9)) drop-shadow(0 0 10px rgba(89,198,255,.45));animation:spTick .55s cubic-bezier(.2,.9,.3,1.25)}
@keyframes spTick{0%{opacity:0;transform:translateY(-12px) scale(.9)}100%{opacity:1;transform:none}}
.sp-cd__lbl{display:block;margin-top:4px;font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#a9bcff}
.sp-cd__bar{position:absolute;left:9px;right:9px;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.sp-cd__bar::after{content:'';position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#cc1b22,#ff6a5f 55%,#59c6ff)}
.sp-cd__tile--s{border-color:rgba(255,106,95,.6);animation:spPulse 1s ease-out infinite}
@keyframes spPulse{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 0 rgba(255,80,80,.45)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 9px rgba(255,80,80,0)}}
.sp-cd--mini{margin-top:3px;padding:5px;gap:0;border-radius:13px;box-shadow:0 4px 14px rgba(12,26,77,.4),0 0 0 1px rgba(204,27,34,.25),inset 0 1px 0 rgba(255,255,255,.2)}
.sp-cd--mini .sp-cd__grid{gap:5px}
.sp-cd--mini .sp-cd__tile{padding:4px 2px 8px;border-radius:9px}
.sp-cd--mini .sp-cd__num{font-size:21px}
.sp-cd--mini .sp-cd__lbl{margin-top:1px;font-size:7.5px;letter-spacing:.15em}
.sp-cd--mini .sp-cd__bar{left:6px;right:6px;bottom:2px;height:2px}
.sp-cd--mini .sp-cd__tile--s{animation:none}
/* ===== Spidey al lado de la foto (inicio) ===== */
.sp-hero-wrap{transform:translateX(-38px)}
.sp-hero-side{position:absolute;left:100%;bottom:-6px;margin-left:-16px;height:196px;width:auto;z-index:25;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));animation:spSideIn .9s cubic-bezier(.22,1.2,.36,1) .3s both,spBob 4.2s ease-in-out 1.3s infinite}
@keyframes spSideIn{0%{opacity:0;transform:translateX(40px) scale(.7) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes spBob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@media (max-width:340px){.sp-hero-side{height:150px}.sp-hero-wrap{transform:translateX(-28px)}}
@media (prefers-reduced-motion:reduce){.sp-cd::after,.sp-cd__bolt,.sp-cd__tile--s,.sp-hero-side{animation:none}.sp-cd__num{animation:none}}

/* ===== Miles colgado (bienvenida) ===== */
.sp-hang{--w:clamp(76px,22vw,100px);display:flex;flex-direction:column;align-items:center;margin-top:-8px;pointer-events:none;user-select:none}
.sp-hang__thread{display:block;width:2px;height:30px;background:linear-gradient(#fff,rgba(255,255,255,.75));opacity:.9;animation:spHangT 3.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spHangT{0%,100%{height:30px}50%{height:8px}}
.sp-hang__img{display:block;width:var(--w);height:auto;margin-top:calc(var(--w) * -.06);transform:translateX(-8%);filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.sp-nameblock--sm{margin-bottom:0;gap:1px}
.sp-nameblock--sm .sp-name{font-size:clamp(24px,7.4vw,30px)}
.sp-cd--mini .sp-cd__tile{padding:3px 2px 7px}
.sp-cd--mini .sp-cd__num{font-size:18px}
.intro-heroes{--hw:clamp(60px,min(21.5vw,12vh),100px);--bb:calc(208px + env(safe-area-inset-bottom,0px))}
@media (max-height:720px){
 .sp-hang{--w:58px}
 .sp-hang__thread{animation-name:spHangTs}
 .intro-heroes{--hw:clamp(56px,min(21vw,10.5vh),90px);--bb:calc(200px + env(safe-area-inset-bottom,0px))}
}
@keyframes spHangTs{0%,100%{height:14px}50%{height:3px}}
@media (prefers-reduced-motion:reduce){.sp-hang__thread{animation:none}}
@media (max-height:720px){.sp-pass{display:none}.sp-daterow{font-size:11px}.sp-daterow .material-symbols-outlined,.sp-venuerow .material-symbols-outlined{display:none}}
.sp-cd-wrap{position:relative;z-index:10;width:100%;margin:2px 0 14px}
</style>
